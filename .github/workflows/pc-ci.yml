name: CarpiNova PC CI

on:
  push:
    branches:
      - design/knowledge-explorer-mvp1-20261012
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test -- tests/app-shell.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1-package-lock
          path: package-lock.json
          if-no-files-found: error
