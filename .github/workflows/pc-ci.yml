name: CarpiNova PC CI

on:
  push:
    branches:
      - design/knowledge-explorer-mvp1-20261012
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Capture audit snapshot
        run: npm audit --json > npm-audit.json || true
      - name: Upload npm resolution
        uses: actions/upload-artifact@v4.6.2
        with:
          name: npm-resolution
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
